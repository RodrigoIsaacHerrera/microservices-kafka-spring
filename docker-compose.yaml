services:
  ### Postgres db for storage-services (inventory)
  db-storage:
    container_name: db-storage
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ms_storage
      POSTGRES_USER: rhworks
      POSTGRES_PASSWORD: s3cr3t
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ### MySql db for orders-services (on-demand)
  db-orders:
    container_name: db-orders
    image: mysql:8.0.34
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ms_orders
      MYSQL_USER: rhworks
      MYSQL_PASSWORD: s3cr3t
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3216:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ### Postgres db for items-services (selling list)
  db-items:
    container_name: db-items
    image: postgres:15.2
    restart: unless-stopped
    environment:
      POSTGRES_DB: ms_items
      POSTGRES_USER: rhworks
      POSTGRES_PASSWORD: s3cr3t
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
